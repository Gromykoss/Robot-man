<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:400px; height:400px; background:#0a0a1a; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; }
  .wrap { width:400px; height:400px; background:radial-gradient(ellipse at center, #0d0d24 0%, #070714 75%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:30px; }
  .big { font-family:'JetBrains Mono',monospace; font-size:150px; font-weight:800; color:#00e5ff; text-shadow:0 0 40px #00e5ff77; line-height:1; }
  .dotrow { display:flex; gap:12px; align-items:center; }
  .dot { width:22px; height:22px; border-radius:50%; }
  .dot.green { background:#00ff88; box-shadow:0 0 16px #00ff88; }
  .dot.amber { background:#ffb020; box-shadow:0 0 16px #ffb020; }
  .sub { font-family:'JetBrains Mono',monospace; font-size:16px; color:#555566; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="big">x4</div>
    <div class="dotrow"><span class="dot green"></span><span class="dot green"></span><span class="dot amber"></span><span class="dot green"></span></div>
    <div class="sub">spawn → gate → merge</div>
  </div>
</body>
</html>
