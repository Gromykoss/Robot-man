<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:400px; height:400px; background:#0a0a1a; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; }
  .wrap { width:400px; height:400px; background:radial-gradient(ellipse at center, #0d0d24 0%, #070714 75%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:28px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .cell { background:#0d0d24; border:1.5px solid #1a1a3e; border-radius:10px; padding:12px 10px; display:flex; flex-direction:column; gap:6px; }
  .cell .repo { font-family:'JetBrains Mono',monospace; font-size:13px; color:#e0e0e0; font-weight:700; }
  .cell .status { display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11px; color:#555566; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .dot.green { background:#00ff88; box-shadow:0 0 8px #00ff88; }
  .dot.amber { background:#ffb020; box-shadow:0 0 8px #ffb020; }
  .cell.amber-cell { border-color:#ffb02055; }
  .label { font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:#00e5ff; text-shadow:0 0 12px #00e5ff88; letter-spacing:2px; }
  .sub { font-family:'JetBrains Mono',monospace; font-size:10px; color:#555566; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="cell">
        <div class="repo">gulag</div>
        <div class="status"><span class="dot green"></span>ok</div>
      </div>
      <div class="cell">
        <div class="repo">rab9</div>
        <div class="status"><span class="dot green"></span>ok</div>
      </div>
      <div class="cell amber-cell">
        <div class="repo">alikhan</div>
        <div class="status"><span class="dot amber"></span>needs approval</div>
      </div>
      <div class="cell">
        <div class="repo">robot-man</div>
        <div class="status"><span class="dot green"></span>ok</div>
      </div>
    </div>
    <div class="label">x4</div>
    <div class="sub">spawn → gate → merge</div>
  </div>
</body>
</html>
