<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:400px; height:400px; background:#0a0a1a; display:flex; align-items:center; justify-content:center; font-family:'Inter',sans-serif; }
  .wrap { width:400px; height:400px; background:radial-gradient(ellipse at center, #0d0d24 0%, #070714 75%); display:flex; align-items:center; justify-content:center; padding:30px; position:relative; overflow:hidden; }
  .wrap::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg, transparent 0px, transparent 4px, rgba(0,255,136,0.05) 4px, rgba(0,255,136,0.05) 5px); }
  .lock { position:relative; z-index:2; width:210px; height:210px; }
  .shackle { width:110px; height:90px; border:26px solid #00ff88; border-bottom:none; border-radius:60px 60px 0 0; margin:0 auto; box-shadow:0 0 26px #00ff8866; }
  .body { width:190px; height:130px; background:#0d0d24; border:26px solid #00ff88; border-radius:16px; margin:-8px auto 0; display:flex; align-items:center; justify-content:center; box-shadow:0 0 26px #00ff8866; }
  .keyhole { width:26px; height:26px; background:#ffb020; border-radius:50%; box-shadow:0 0 18px #ffb020; position:relative; }
  .keyhole::after { content:''; position:absolute; left:50%; transform:translateX(-50%); top:18px; width:10px; height:16px; background:#ffb020; border-radius:0 0 6px 6px; box-shadow:0 0 10px #ffb020; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lock">
      <div class="shackle"></div>
      <div class="body"><div class="keyhole"></div></div>
    </div>
  </div>
</body>
</html>
