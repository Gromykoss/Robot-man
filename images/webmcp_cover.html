<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebMCP cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #07101f;
    --navy-2: #0b1730;
    --navy-3: #10203c;
    --cyan: #3ee0ff;
    --cyan-dim: #1aa7c4;
    --cyan-soft: rgba(62, 224, 255, 0.16);
    --amber: #f5b942;
    --amber-hot: #ffd56a;
    --amber-soft: rgba(245, 185, 66, 0.22);
    --ink: #d7e7f5;
    --muted: #6d849c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 2500px;
    height: 1000px;
    overflow: hidden;
    background: var(--navy);
  }
  .stage {
    position: relative;
    width: 2500px;
    height: 1000px;
    background:
      radial-gradient(ellipse 900px 520px at 50% 42%, rgba(245, 185, 66, 0.10), transparent 62%),
      radial-gradient(ellipse 700px 480px at 16% 42%, rgba(62, 224, 255, 0.08), transparent 60%),
      radial-gradient(ellipse 700px 480px at 84% 42%, rgba(62, 224, 255, 0.08), transparent 60%),
      linear-gradient(180deg, #081325 0%, var(--navy) 55%, #050c18 100%);
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(62, 224, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62, 224, 255, 0.045) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 42%, #000 30%, transparent 78%);
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 92% 88% at 50% 45%, transparent 50%, rgba(3, 8, 16, 0.72) 100%);
    pointer-events: none;
  }

  /* LEFT: webpage */
  .page {
    position: absolute;
    left: 110px;
    top: 96px;
    width: 640px;
    height: 648px;
    background: linear-gradient(180deg, #0e1c34 0%, #0a162a 100%);
    border: 2px solid rgba(62, 224, 255, 0.55);
    border-radius: 18px;
    box-shadow:
      0 0 0 1px rgba(62, 224, 255, 0.12),
      0 24px 60px rgba(0, 0, 0, 0.45),
      0 0 48px rgba(62, 224, 255, 0.12);
    overflow: hidden;
  }
  .chrome {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 22px;
    border-bottom: 1px solid rgba(62, 224, 255, 0.18);
    background: rgba(7, 16, 31, 0.55);
  }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--cyan-dim);
    opacity: 0.7;
  }
  .url {
    flex: 1;
    height: 32px;
    border-radius: 8px;
    background: rgba(62, 224, 255, 0.08);
    border: 1px solid rgba(62, 224, 255, 0.22);
    color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
    font-size: 18px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    letter-spacing: 0.04em;
  }
  .code {
    padding: 36px 32px 24px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 27px;
    line-height: 1.7;
    color: var(--muted);
  }
  .tag { color: var(--cyan); }
  .attr { color: #9fb6c9; }
  .str { color: #b7f3ff; }
  .line {
    white-space: nowrap;
    position: relative;
  }
  .indent-1 { padding-left: 28px; }
  .indent-2 { padding-left: 56px; }
  .injected {
    margin: 10px -16px;
    padding: 8px 16px 8px 16px;
    background: linear-gradient(90deg, rgba(245, 185, 66, 0.22), rgba(245, 185, 66, 0.06) 70%, transparent);
    border-left: 5px solid var(--amber);
    box-shadow: 0 0 28px rgba(245, 185, 66, 0.28);
    color: var(--amber-hot);
  }
  .injected .tag { color: var(--amber-hot); }
  .injected .str { color: #ffe7a3; }
  .injected .attr { color: #e6c97a; }
  .inject-arrow {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    background: var(--amber);
    clip-path: polygon(0 20%, 55% 20%, 55% 0, 100% 50%, 55% 100%, 55% 80%, 0 80%);
    box-shadow: 0 0 16px var(--amber);
  }

  /* CENTER toggle */
  .toggle-wrap {
    position: absolute;
    left: 980px;
    top: 330px;
    width: 540px;
    height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 4;
  }
  .toggle-label {
    font-family: Orbitron, sans-serif;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.42em;
    color: var(--amber);
    margin-bottom: 18px;
    text-shadow: 0 0 16px rgba(245, 185, 66, 0.7);
  }
  .toggle {
    width: 430px;
    height: 148px;
    border-radius: 80px;
    background: #06101c;
    border: 3px solid rgba(245, 185, 66, 0.85);
    box-shadow:
      0 0 0 8px rgba(245, 185, 66, 0.10),
      0 0 50px rgba(245, 185, 66, 0.45),
      inset 0 0 30px rgba(245, 185, 66, 0.12);
    position: relative;
    overflow: hidden;
  }
  .toggle-fill {
    position: absolute;
    left: 18px;
    top: 16px;
    bottom: 16px;
    right: 92px;
    border-radius: 70px;
    background: linear-gradient(90deg, #7a4a08 0%, #f5b942 55%, #ffe08a 100%);
    box-shadow: 0 0 24px rgba(245, 185, 66, 0.55);
  }
  .knob {
    position: absolute;
    right: 16px;
    top: 14px;
    width: 116px;
    height: 116px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #fff6d6, #f5b942 42%, #c48412 100%);
    box-shadow:
      0 8px 18px rgba(0, 0, 0, 0.35),
      0 0 28px rgba(255, 213, 106, 0.85);
    border: 2px solid #ffe7a8;
  }
  .knob::after {
    content: "";
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    border: 2px solid rgba(7, 16, 31, 0.28);
  }
  .on-text {
    position: absolute;
    left: 54px;
    top: 50%;
    transform: translateY(-50%);
    font-family: Orbitron, sans-serif;
    font-weight: 900;
    font-size: 42px;
    letter-spacing: 0.18em;
    color: #1a1204;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .toggle-sub {
    margin-top: 16px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.28em;
    color: var(--cyan);
    opacity: 0.85;
  }

  /* RIGHT cards */
  .cards {
    position: absolute;
    right: 110px;
    top: 120px;
    width: 700px;
    height: 620px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 36px;
  }
  .card {
    background: linear-gradient(180deg, #10233f 0%, #0b1a30 100%);
    border: 2px solid rgba(62, 224, 255, 0.5);
    border-radius: 18px;
    box-shadow:
      0 16px 40px rgba(0, 0, 0, 0.35),
      0 0 28px rgba(62, 224, 255, 0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card svg {
    width: 118px;
    height: 118px;
  }
  .card-pip {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }

  /* streams */
  .streams {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 42px;
    text-align: center;
    font-family: Orbitron, sans-serif;
    font-weight: 800;
    font-size: 58px;
    letter-spacing: 0.18em;
    color: #f4fbff;
    text-shadow:
      0 0 18px rgba(62, 224, 255, 0.35),
      0 2px 0 rgba(0, 0, 0, 0.4);
    z-index: 6;
  }
  .caption span {
    color: var(--cyan);
  }
  .caption em {
    font-style: normal;
    color: var(--amber);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>

  <div class="page">
    <div class="chrome">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="url">https://site.example</div>
    </div>
    <div class="code">
      <div class="line">&lt;!DOCTYPE html&gt;</div>
      <div class="line">&lt;<span class="tag">html</span>&gt;</div>
      <div class="line indent-1">&lt;<span class="tag">head</span>&gt;</div>
      <div class="line indent-2">&lt;<span class="tag">title</span>&gt;site&lt;/<span class="tag">title</span>&gt;</div>
      <div class="line indent-2 injected">
        &lt;<span class="tag">link</span> <span class="attr">rel=</span><span class="str">"mcp"</span> <span class="attr">href=</span><span class="str">"/mcp"</span>&gt;
      </div>
      <div class="line indent-1">&lt;/<span class="tag">head</span>&gt;</div>
      <div class="line indent-1">&lt;<span class="tag">body</span>&gt;</div>
      <div class="line indent-2">&lt;<span class="tag">h1</span>&gt;index&lt;/<span class="tag">h1</span>&gt;</div>
      <div class="line indent-1">&lt;/<span class="tag">body</span>&gt;</div>
      <div class="line">&lt;/<span class="tag">html</span>&gt;</div>
    </div>
  </div>

  <svg class="streams" viewBox="0 0 2500 1000" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="cyanFlow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#3ee0ff" stop-opacity="0.15"/>
        <stop offset="45%" stop-color="#3ee0ff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#3ee0ff" stop-opacity="0.2"/>
      </linearGradient>
      <linearGradient id="amberFlow" x1="1" y1="0" x2="0" y2="0">
        <stop offset="0%" stop-color="#f5b942" stop-opacity="0.2"/>
        <stop offset="50%" stop-color="#f5b942" stop-opacity="1"/>
        <stop offset="100%" stop-color="#f5b942" stop-opacity="0.15"/>
      </linearGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- page -> toggle, structured parallel channels -->
    <g filter="url(#glow)" fill="none" stroke-linecap="round">
      <path d="M748 430 C860 430, 920 395, 980 395" stroke="url(#cyanFlow)" stroke-width="5"/>
      <path d="M748 452 C850 452, 925 422, 980 422" stroke="url(#cyanFlow)" stroke-width="4" opacity="0.8"/>
      <path d="M748 474 C845 474, 930 450, 980 450" stroke="url(#cyanFlow)" stroke-width="3.5" opacity="0.6"/>
      <path d="M748 496 C855 496, 920 478, 980 478" stroke="#3ee0ff" stroke-width="2.5" opacity="0.45"/>

      <!-- injection beam from the amber HTML line (inside <head>) into the MCP toggle -->
      <path d="M748 421 C840 421, 900 428, 980 428" stroke="#f5b942" stroke-width="5" opacity="0.95"/>

      <!-- toggle -> cards -->
      <path d="M1520 395 C1620 395, 1640 230, 1690 230" stroke="url(#cyanFlow)" stroke-width="5"/>
      <path d="M1520 422 C1630 422, 1648 270, 1690 270" stroke="#3ee0ff" stroke-width="3.5" opacity="0.75"/>
      <path d="M1520 450 C1635 454, 1640 530, 1690 545" stroke="url(#cyanFlow)" stroke-width="5"/>
      <path d="M1520 478 C1625 494, 1645 610, 1690 620" stroke="#3ee0ff" stroke-width="3.5" opacity="0.75"/>
    </g>

    <!-- protocol packets -->
    <g filter="url(#glow)">
      <rect x="800" y="424" width="24" height="11" rx="2" fill="#3ee0ff"/>
      <rect x="878" y="446" width="18" height="9" rx="2" fill="#7af0ff" opacity="0.9"/>
      <rect x="840" y="470" width="20" height="9" rx="2" fill="#3ee0ff" opacity="0.75"/>
      <rect x="1588" y="300" width="22" height="11" rx="2" fill="#3ee0ff"/>
      <rect x="1610" y="500" width="20" height="10" rx="2" fill="#7af0ff"/>
      <rect x="620" y="417" width="22" height="11" rx="2" fill="#f5b942"/>
      <rect x="820" y="417" width="18" height="10" rx="2" fill="#ffd56a"/>
    </g>
  </svg>

  <div class="toggle-wrap">
    <div class="toggle-label">MCP STREAM</div>
    <div class="toggle">
      <div class="toggle-fill"></div>
      <div class="on-text">ON</div>
      <div class="knob"></div>
    </div>
    <div class="toggle-sub">PROTOCOL CHANNELS ACTIVE</div>
  </div>

  <div class="cards">
    <div class="card" aria-label="id card">
      <div class="card-pip"></div>
      <svg viewBox="0 0 120 120" fill="none">
        <rect x="18" y="28" width="84" height="64" rx="8" stroke="#3ee0ff" stroke-width="4"/>
        <circle cx="44" cy="54" r="12" stroke="#3ee0ff" stroke-width="4"/>
        <path d="M64 46h30M64 58h22M28 78h64" stroke="#3ee0ff" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card" aria-label="network graph">
      <div class="card-pip"></div>
      <svg viewBox="0 0 120 120" fill="none">
        <path d="M60 28 L92 50 L78 90 L42 90 L28 50 Z" stroke="#3ee0ff" stroke-width="4"/>
        <circle cx="60" cy="60" r="10" fill="#f5b942"/>
        <circle cx="60" cy="28" r="7" fill="#3ee0ff"/>
        <circle cx="92" cy="50" r="7" fill="#3ee0ff"/>
        <circle cx="78" cy="90" r="7" fill="#3ee0ff"/>
        <circle cx="42" cy="90" r="7" fill="#3ee0ff"/>
        <circle cx="28" cy="50" r="7" fill="#3ee0ff"/>
      </svg>
    </div>
    <div class="card" aria-label="feed">
      <div class="card-pip"></div>
      <svg viewBox="0 0 120 120" fill="none">
        <rect x="22" y="28" width="76" height="18" rx="4" stroke="#3ee0ff" stroke-width="4"/>
        <rect x="22" y="51" width="76" height="18" rx="4" stroke="#3ee0ff" stroke-width="4"/>
        <rect x="22" y="74" width="52" height="18" rx="4" stroke="#3ee0ff" stroke-width="4"/>
        <circle cx="34" cy="37" r="4" fill="#f5b942"/>
        <circle cx="34" cy="60" r="4" fill="#f5b942"/>
        <circle cx="34" cy="83" r="4" fill="#f5b942"/>
      </svg>
    </div>
    <div class="card" aria-label="envelope">
      <div class="card-pip"></div>
      <svg viewBox="0 0 120 120" fill="none">
        <rect x="20" y="34" width="80" height="54" rx="6" stroke="#3ee0ff" stroke-width="4"/>
        <path d="M20 40 L60 68 L100 40" stroke="#3ee0ff" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="caption"><span>WEBMCP</span><em>:</em> SITES SPEAK <span>MCP</span></div>
  <div class="vignette"></div>
</div>
</body>
</html>
